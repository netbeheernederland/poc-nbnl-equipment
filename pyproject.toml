[project]
name = "poc-nbnl-equipment"
version = "0.1.0"
description = "Proof of concept of NBNL EQ profile represented in SHACL."
readme = "README.md"
authors = [
    { name = "Bart Kleijngeld", email = "bartkl@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nbconvert>=7.17.2",
    "pyshacl[oxigraph]>=0.40.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
